<!DOCTYPE html>
<html lang="en">
<head>
    <!-- Default production favicon, may be overridden by nav-sync.js -->
    <link id="dynamic-favicon" rel="icon" type="image/x-icon" href="favicon.ico" />

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tales of Defiance to Mind Control in the Modern Age</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background-color: #ffffff;
            color: #1a1a1a;
            overflow: hidden; /* Prevents double scrollbars on the main window */
        }

        /* --- CONTENT FRAME UNDER HEADER --- */
        .content-frame {
            width: 100%;
            /* Fills remaining viewport height beneath the header */
            height: calc(100vh - 110px); 
            border: none;
            display: block;
        }
    </style>
  <script src="nav-sync.js"></script>
</head>
<body>

    <!-- Top Navigation Header with Custom Logo and Title -->
  <header style="
    background-color: #DCE8F5; /* very light blue */
    padding: 0.1rem 0.1rem;
    border-top: 2px solid black;
    border-bottom: 2px solid black;
    color: #003061; /* Dark blue text color from logo */
  ">
      <div style="display: flex; justify-content: flex-start; align-items: center; max-width: 1200px; margin: 0 auto; gap: 2rem;">
        
        <!-- GROUP 1: Grouping the Dropdown and Brand Logo -->
        <div style="display: flex; align-items: center; gap: 1.5rem;">

          <!-- Course Week Dropdown (Targeting iframe below) -->
         <select id="page-select" style="
             padding: 0.4rem 0.5rem;
             font-size: 0.95rem;
             cursor: pointer;
	     width: auto;               /* Allows the box to expand to fit the text */
	     min-width: 180px;          /* Prevents it from collapsing too small on short titles */
             max-width: 260px;          /* Prevents long titles from crowding the BOLLI logo */
             text-overflow: ellipsis;   /* Gracefully truncates only exceptionally long items */
             white-space: nowrap;
             overflow: hidden;
           ">

           <optgroup label="Main Units">
             <option value="DMC_welcome.html" selected> Welcome Letter </option>
             <option value="DMC_syllabus.html">Syllabus</option>
             <option value="DMC_preface.html"> Course Preface </option>
             <option value="DMC_week1.html">Week 1: Notes from Underground</option>
             <option value="DMC_week2.html">Week 2: 1984</option>
             <option value="DMC_week3.html">Week 3: The Matrix </option>
             <option value="DMC_week4.html">Week 4: The Perfect Match</option>
             <option value="DMC_week5.html">Week 5: Final Wrap-up</option>
           </optgroup>

           <optgroup label="Assigned Readings & Resources">
             <option value="DMC_notes_on_notes.html" > Notes on "Notes from Underground" </option> 
             <option value="DMC_notes_on_1984.html" > Notes on "1984" </option> 
             <option value="DMC_notes_on_thematrix.html" > Notes on "The Matrix"</option> 
             <option value="DMC_notes_on_perfectmatch.html" > Notes on "The Perfect Match"</option> 
           </optgroup>

           <optgroup label="Extra: Non-fiction">
             <option value="materials/DMC_references_and_summaries.html"> References and Summaries </option>
             <option value="mind_control_extras/DMC_Chronology.html"> DMC Chronology </option>
             <option value="mind_control_extras/DMC_notesfrumunderground_context.html"> Context of "Notes from the Underground" </option>
             <option value="mind_control_extras/TwoKindsOfControl.html"> Two Kinds of Control </option>
           </optgroup>

           <optgroup label="Extra: Fiction">
             <option value="mind_control_extras/UndergroundBarbie.html" > Underground Barbie </option> 
             <option value="mind_control_extras/DMC_question_responses_by_characters_and_students.html" > Fictional Responses to Questions </option> 
             <option value="mind_control_extras/DMC_protagonists_react_to_manifesto.html" > Reactions to Manifesto</option> 
             <option value="mind_control_extras/PanelOfTheDefiant.html" > The Panel of the Defiant </option> 
             <option value="mind_control_extras/TheTriadChapter1.html" > The Triad, Ch. 1</option> 
           </optgroup>

<!-- @@@DEV@@
           <optgroup label="Developing">
	     <option value="mind_control_1/mind_control_1.html" > Mind Control 1 </option> 
@@DEV@@  -->
	       
         </select>

         <!-- Brandeis logo and institute name as a single image asset -->
         <img src="images/BOLLI_logo.svg" alt="Logo" style="height: 35px; width: auto; display: inline-block;">
        </div>

        <!-- GROUP 2: Course Title (Editable Text) -->
        <h1 style="
            display: inline-block;   /* Fits the element tightly around the text */
            text-align: center;      /* Centers the two lines relative to each other */
            font-size: 1.0rem;        /* Slightly reduced font size so two lines fit gracefully */
            line-height: 1.25;        /* Tightens line spacing between the two lines */
            font-weight: 500;
            font-family: serif;
            margin: 0;
          ">
          Tales of Defiance to Mind Control in the Modern Age <!-- can put <br>'s here to force line breaks -->
        </h1>

      </div>
    </header>

    <!-- Main Content Display Area (Loads DMC_welcome.html by default) -->
    <iframe id="main-content" name="main-content" src="DMC_welcome.html" class="content-frame"></iframe>

</body>
</html>
