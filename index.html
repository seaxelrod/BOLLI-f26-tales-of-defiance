<script>
  document.addEventListener('DOMContentLoaded', function() {
    const select = document.getElementById('page-select');
    const iframe = document.getElementById('main-content');
    const fallbackPage = 'under-construction.html';

    if (!select || !iframe) {
      console.warn("Could not find #page-select or #main-content elements.");
      return;
    }

    function loadPage(url) {
      if (!url) return;

      // Check if target file exists before pointing the iframe to it
      fetch(url, { method: 'HEAD' })
        .then(response => {
          if (response.ok) {
            iframe.src = url;
            localStorage.setItem('selectedCoursePage', url);
          } else {
            iframe.src = fallbackPage;
          }
        })
        .catch(() => {
          // If fetch fails (file doesn't exist locally/on server)
          console.warn("Select page doesn't exist, falling back to under-construction.html.");
          iframe.src = fallbackPage;
        });
    }

    // 1. Restore previous selection on initial load
    const savedPage = localStorage.getItem('selectedCoursePage') || 'syllabus.html';
    select.value = savedPage;
    loadPage(savedPage);

    // 2. Listen for dropdown changes
    select.addEventListener('change', function(e) {
      const selectedValue = e.target.value;
      console.log("Selected:", selectedValue);
      loadPage(selectedValue);
    });
  });
</script>
